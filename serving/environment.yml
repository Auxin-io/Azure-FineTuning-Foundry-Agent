name: docintel-qwen-serving
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Listed inline on purpose: the image builder copies only this file,
      # so `-r requirements.txt` cannot resolve inside the build.
      - azureml-inference-server-http
      - torch==2.3.1
      - transformers==4.46.1
      - peft==0.13.2
      - accelerate==1.1.1
      - sentencepiece
