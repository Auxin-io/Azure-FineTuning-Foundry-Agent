$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
display_name: docintel-finance-closed-book
experiment_name: docintel-finance
description: >-
  LoRA fine-tune of Qwen2.5-3B-Instruct on the finance closed-book data:
  615 question->answer rows, no document text, so the model answers finance
  questions from its weights. CPU cluster while the subscription has no
  Azure ML GPU quota; on the T4 the same script runs QLoRA (4-bit base).

code: .
command: >-
  python train.py
  --model-name ${{inputs.model_name}}
  --train-data ${{inputs.train_data}}
  --validation-data ${{inputs.validation_data}}
  --output-dir ${{outputs.model}}
  --epochs ${{inputs.epochs}}
  --max-seq-length ${{inputs.max_seq_length}}
  --batch-size ${{inputs.batch_size}}
  --grad-accum ${{inputs.grad_accum}}
  --lora-r ${{inputs.lora_r}}
  --lora-alpha ${{inputs.lora_alpha}}

environment:
  image: mcr.microsoft.com/azureml/openmpi5.0-cuda12.4-ubuntu22.04
  conda_file: environment.yml

compute: azureml:gpu-t4

inputs:
  model_name: Qwen/Qwen2.5-3B-Instruct
  train_data:
    type: uri_file
    path: azureml:docintel-finance-train:3
  validation_data:
    type: uri_file
    path: azureml:docintel-finance-validation:3
  # Closed-book recall needs many passes - 3 epochs teaches format, 15 teaches facts.
  epochs: 15
  max_seq_length: 256
  batch_size: 4
  grad_accum: 4
  lora_r: 16
  lora_alpha: 32

outputs:
  model:
    type: uri_folder
